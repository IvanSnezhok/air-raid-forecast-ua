# Refresh the forecast on a schedule and keep it as a run artifact.
# GitHub Pages is published by pages.yml (the web UI); this workflow no longer
# deploys there, so it cannot overwrite the UI with the old demo page.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ALERTS_IN_UA_TOKEN  optional; without it the forecast is made as of the end
#                       of the volunteer dataset (updated about once a day)
name: forecast

on:
  schedule:
    # Hourly, a few minutes past the hour. Free on a public repo; on a private
    # Free-plan repo switch to "7 */3 * * *" to stay under 2000 min/month.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Forecast
        env:
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
        run: |
          mkdir -p reports
          python predict_now.py
      - name: Threat-type forecast
        # needs the Air Force post history from the threat-labels workflow
        continue-on-error: true
        run: |
          pip install beautifulsoup4
          git fetch --depth=1 origin threat-labels-data
          git show FETCH_HEAD:tg_kpszsu.parquet > "$RUNNER_TEMP/tg_kpszsu.parquet"
          python threat-type/predict_type_now.py --posts "$RUNNER_TEMP/tg_kpszsu.parquet"
      - name: Build page
        run: |
          python demo/make_site.py reports/forecast_now.csv site
          cp threat-type/reports/type_forecast_now.csv threat-type/reports/type_forecast_meta.json site/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: forecast
          path: |
            reports/forecast_now.csv
            threat-type/reports/type_forecast_now.csv
            site/
          retention-days: 14
