# Train the served model set out of the 10-minute pipeline's hot path and publish
# it through the Actions cache (key: models-v2-<hash of the modelling code and of
# reports/run_summary.json>-<data end>-<trained at>). The pipeline restores the
# newest bundle with that prefix in every run, so the cache never goes 7 days
# unused; caches saved on the default branch are visible to every branch.
# If no compatible bundle exists (cache evicted, modelling code changed) the
# pipeline trains once itself and saves it, so the site never stops.
#
# Triggers: daily; dispatched by the pipeline when the volunteer dataset has 6 h
# more data than the served models (or they came from the fallback); by hand.
name: train

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/pipeline-requirements.txt
      - run: pip install -q -r .github/pipeline-requirements.txt
      - name: Model cache key
        id: key
        run: echo "prefix=$(python3 scripts/pipeline.py models-key)" >> "$GITHUB_OUTPUT"
      # [hook: raion layer] official file (fixed cache key: it stopped updating) and the store
      # history the raion models train on; both only once src/airraid/raions.py exists
      - name: "[optional] Official raion-level file (cached)"
        if: hashFiles('src/airraid/raion_data.py') != ''
        uses: actions/cache@v4
        with:
          path: data/raw/official_data_en.csv
          key: official-data-en-v1
      - name: "[optional] Store history for the raion models"
        if: hashFiles('src/airraid/raions.py') != ''
        run: |
          STORE=live-data STORE_DAYS=60 bash .github/scripts/live-data.sh checkout
          echo "AIRRAID_STORE=live-data" >> "$GITHUB_ENV"
      - name: Train (holdout week, then the final refit; raion models when present)
        run: python scripts/train_models.py --out var/models --threads 4 $([ -f src/airraid/raions.py ] && echo --raions)
      # [hook: text signals] the history + Telegram models, cached in the same bundle (<models>/text)
      - name: "[optional] Text models"
        if: hashFiles('src/airraid/text/serving.py') != ''
        continue-on-error: true  # the history-only bundle is published regardless
        run: |
          bash .github/scripts/text-data.sh checkout
          PYTHONPATH=src python -m airraid.text.serving train --root text-data --model-dir var/models/text
      - name: Model info
        id: minfo
        run: python3 scripts/pipeline.py models-info --models var/models
      - name: Publish to the cache
        uses: actions/cache/save@v4
        with:
          path: var/models
          key: ${{ steps.key.outputs.prefix }}-${{ steps.minfo.outputs.suffix }}
