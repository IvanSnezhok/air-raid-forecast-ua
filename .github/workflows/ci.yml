# Tests on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Web app tests (synthetic data, offline)
        run: pytest tests/app -q
      - name: Web UI in a browser (English by default, no Ukrainian left in EN mode, language switch, phone width)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"  # the runner's Google Chrome is used
          AIRRAID_UI_CHANNEL: chrome
          AIRRAID_UI_REQUIRED: "1"
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          AIRRAID_UI_NODE_PATH="$RUNNER_TEMP/pw/node_modules" pytest tests/app/test_ui_browser.py -q
      - name: No-leakage tests (downloads the dataset)
        run: pytest tests/test_leakage.py -q
      - name: Live data (merge definition, point-in-time store, verification)
        run: pytest tests/test_live_alerts.py tests/test_store.py tests/test_verify.py -q
      - name: Pipeline glue (gate, keep-alive, status, model cache key)
        run: pytest tests/test_pipeline_glue.py -q
      - name: Workflow and pipeline scripts parse
        run: |
          pip install -q pyyaml
          python -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"
          bash -n .github/scripts/*.sh
      - name: Threat-type no-leakage tests
        run: pytest threat-type/tests -q
      - name: Raion no-leakage tests (downloads the official raion file)
        run: pytest tests/test_raion_leakage.py -q
      - name: Telegram text signals tests (no leakage, serving fallback; synthetic, offline)
        run: pytest tests/test_text_leakage.py tests/test_text_serving.py -q
      - name: Docker image builds
        run: docker build -t airraid .
