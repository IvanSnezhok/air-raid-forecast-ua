# Collect new posts from the public Telegram channels every 30 minutes and keep
# them on a separate `telegram-data` branch, so main stays code-only.
#
# Secrets:
#   TG_API_ID, TG_API_HASH  from https://my.telegram.org
#   TG_SESSION_STRING       Telethon StringSession; create it once on your own
#                           machine with `python deploy/tg_session_string.py`.
#                           It is a full login to your Telegram account: use a
#                           spare account if you can, never print or commit it.
#
# Polling every 30 min records each post's text as of at most ~30 min after
# publication, which is close to the live `follow` mode for leakage purposes.
name: telegram

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Stay green until the collector is in the repo and the secrets are set.
      - name: Check prerequisites
        id: check
        env:
          HAS_SESSION: ${{ secrets.TG_SESSION_STRING != '' }}
        run: |
          if [ -f text-features/collect_telegram.py ] && [ "$HAS_SESSION" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: text-features/ or TG_SESSION_STRING secret missing"
          fi
      - name: Check out data branch
        if: steps.check.outputs.ready == 'true'
        run: |
          git fetch origin telegram-data || true
          if git rev-parse --verify -q origin/telegram-data; then
            git worktree add tgdata origin/telegram-data
          else
            git worktree add --orphan -b telegram-data tgdata
          fi
          mkdir -p text-features/data
          rm -rf text-features/data/telegram
          mkdir -p tgdata/telegram
          ln -s "$PWD/tgdata/telegram" text-features/data/telegram
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.ready == 'true'
        run: pip install -r text-features/requirements.txt
      - name: Collect
        if: steps.check.outputs.ready == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        working-directory: text-features
        # --since only matters on the first runs; each run stops after
        # --budget-min so the Commit step always runs, and the next run
        # resumes from the last stored post id per channel.
        run: python collect_telegram.py backfill --since 2024-01-01 --budget-min 10
      - name: Commit
        if: steps.check.outputs.ready == 'true'
        working-directory: tgdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram
          git diff --cached --quiet && exit 0
          git commit -q -m "telegram: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:telegram-data
