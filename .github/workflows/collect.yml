# Daily alerts.in.ua history pull into the point-in-time store on the orphan branch
# `live-data` (src/airraid/store.py): /month_ago history per oblast (+ raions when
# the oblast history lacks them) -> alerts_history. The API keeps only ~30 days,
# so anything not pulled within a month is lost for good. The 10-minute poll of
# /alerts/active.json is part of the pipeline (pipeline.yml), so there is one
# writer of live-data per 10 minutes.
#
# This job takes ~13 minutes (2 history requests a minute) and runs alongside the
# pipeline instead of blocking it: both only add new, uniquely named files (each
# owns its own _state/ file), and .github/scripts/live-data.sh rebases and retries
# a push that raced the other writer.
#
# Secret: ALERTS_IN_UA_TOKEN (the job is skipped without it). Never printed.
name: collect-history

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: collect-history
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: src
  STORE: live-data

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check prerequisites
        id: check
        env:
          HAS_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Skipping: ALERTS_IN_UA_TOKEN secret is not set"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'true'
        run: pip install -q pandas pyarrow
      - name: Check out the data branch
        if: steps.check.outputs.ready == 'true'
        # 35 days of partitions: the history dedup looks back ~31 days
        run: STORE_DAYS=35 bash .github/scripts/live-data.sh checkout
      - name: Pull history in chunks, committing after each
        if: steps.check.outputs.ready == 'true'
        env:
          ALERTS_IN_UA_TOKEN: ${{ secrets.ALERTS_IN_UA_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            python -m airraid.collect history --root "$STORE" --max-requests 15 | tee "$RUNNER_TEMP/history.log"
            bash .github/scripts/live-data.sh commit "history $(date -u +%FT%H:%MZ)"
            grep -q "^history: 0 requests" "$RUNNER_TEMP/history.log" && break
          done
