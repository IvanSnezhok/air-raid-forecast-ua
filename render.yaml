# Render Blueprint (https://render.com/docs/blueprint-spec): New -> Blueprint -> pick this repo.
# Free web services sleep after 15 min without traffic and have 512 MB RAM, so
# the app trains on a 6-month window there; Hugging Face Spaces (16 GB) is the
# recommended free host, see docs/web-app.md.
services:
  - type: web
    name: air-raid-forecast
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: AIRRAID_TRAIN_MONTHS
        value: "6"
      - key: AIRRAID_MAX_TRAIN_MONTHS
        value: "6"
      - key: AIRRAID_LGB_THREADS
        value: "1"
      - key: ALERTS_IN_UA_TOKEN
        sync: false   # set in the Render dashboard, never in the repo
