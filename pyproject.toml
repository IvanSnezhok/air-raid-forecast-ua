[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "air-raid-forecast-ua"
version = "0.1.0"
description = "Hourly air raid alert forecasts for Ukrainian oblasts: models, FastAPI service and web UI"
readme = "docs/web-app.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyarrow>=15",
    "tzdata",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
research = ["matplotlib>=3.8", "tabulate>=0.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
airraid-app = "airraid_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airraid = ["resources/*.csv"]
airraid_app = ["static/*"]
